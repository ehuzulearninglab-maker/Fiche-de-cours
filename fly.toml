# Fly.io deployment config for the Fiche-de-cour Flask app.
# Usage:
#   flyctl launch --no-deploy   # la première fois, pour créer l'app
#   flyctl deploy
#
# L'app est ensuite accessible sur https://<app-name>.fly.dev.
# Tu peux mettre Cloudflare devant via un CNAME ou Cloudflare Tunnel
# (voir DEPLOY.md).
app = "fiche-de-cour"
primary_region = "cdg"  # Paris (proche du Bénin)

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
